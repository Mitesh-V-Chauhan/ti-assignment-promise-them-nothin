# docker-compose.yml — Local multi-node development environment
#
# Architecture:
#   Client → nginx (:8080) → node-1, node-2, node-3 (:3000 internal) → redis (:6379)
#
# Usage:
#   docker compose up --build
#
# Ports exposed to host:
#   8080  — nginx load balancer (entry point for harness/testing)
#   3001  — node-1 direct access (for debugging/targeted testing)
#   3002  — node-2 direct access
#   3003  — node-3 direct access
#   6379  — redis direct access

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 5

  node-1:
    build: .
    environment:
      - PORT=3000
      - NODE_ID=node-1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3001:3000"
    depends_on:
      redis:
        condition: service_healthy

  node-2:
    build: .
    environment:
      - PORT=3000
      - NODE_ID=node-2
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3002:3000"
    depends_on:
      redis:
        condition: service_healthy

  node-3:
    build: .
    environment:
      - PORT=3000
      - NODE_ID=node-3
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3003:3000"
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node-1
      - node-2
      - node-3
